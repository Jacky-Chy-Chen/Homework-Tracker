<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="#F2F4F3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101417" media="(prefers-color-scheme: dark)" />
    <title>Classboard</title>
    <script>
      // Apply the theme before first paint so the page never flashes the wrong one.
      (function () {
        var t
        try { t = localStorage.getItem('hw-theme') } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = t
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
